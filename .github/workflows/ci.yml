name: MediDesk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -v
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  build-scan-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        env:
          IMAGE_OWNER: ${{ steps.owner.outputs.value }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$IMAGE_OWNER/medidesk-backend:$IMAGE_TAG" \
            ./backend

          docker build \
            -t "$REGISTRY/$IMAGE_OWNER/medidesk-frontend:$IMAGE_TAG" \
            ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/medidesk-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/medidesk-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push images to GHCR
        env:
          IMAGE_OWNER: ${{ steps.owner.outputs.value }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/$IMAGE_OWNER/medidesk-backend:$IMAGE_TAG"
          docker push "$REGISTRY/$IMAGE_OWNER/medidesk-frontend:$IMAGE_TAG"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes credentials
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::Missing KUBE_CONFIG_DATA repository secret."
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --client

      - name: Deploy with Helm
        env:
          IMAGE_OWNER: ${{ steps.owner.outputs.value }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install medidesk ./helm/medidesk \
            --namespace medidesk \
            --create-namespace \
            --set-string backend.tag="$IMAGE_TAG" \
            --set-string frontend.tag="$IMAGE_TAG" \
            --set-string backend.image="$REGISTRY/$IMAGE_OWNER/medidesk-backend" \
            --set-string frontend.image="$REGISTRY/$IMAGE_OWNER/medidesk-frontend"
