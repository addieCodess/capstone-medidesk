services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medidesk
      POSTGRES_USER: medidesk
      POSTGRES_PASSWORD: medidesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medidesk"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://medidesk:medidesk@postgres:5432/medidesk
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
