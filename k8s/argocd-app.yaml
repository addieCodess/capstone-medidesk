apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medidesk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/medidesk-capstone.git
    targetRevision: HEAD
    path: helm/medidesk
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: medidesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
